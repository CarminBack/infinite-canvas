name: Docker image

on:
  push:
    branches: ["upgrade/upstream-v0.19-token"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/carminback/infinite-canvas

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,prefix=

  build:
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-v019-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-v019-${{ matrix.arch }}
      - name: Export digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Create multi-arch manifest
        shell: bash
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tag_args+=("-t" "$tag"); fi
          done <<< "$TAGS"
          digest_args=()
          while IFS= read -r digest_file; do
            digest_args+=("${IMAGE_NAME}@sha256:${digest_file}")
          done < <(find "$RUNNER_TEMP/digests" -type f -printf '%f\n' | sort)
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

  smoke:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start candidate image
        shell: bash
        run: |
          image="${IMAGE_NAME}:${GITHUB_SHA::7}"
          docker pull "$image"
          docker run -d --name canvas-smoke -p 3019:3000 \
            -e CANVAS_PUBLIC_ORIGIN=http://127.0.0.1:3019 \
            -e TOKEN_API_BASE_URL=https://token.invalid \
            -e IMAGE_API_BASE_URL=https://image.invalid \
            -e CANVAS_OAUTH_CLIENT_SECRET=test-secret \
            -e CANVAS_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            "$image"
      - name: Verify gateway and static app
        shell: bash
        run: |
          for attempt in {1..30}; do
            if [ "$(docker inspect canvas-smoke --format '{{.State.Health.Status}}')" = "healthy" ]; then break; fi
            sleep 1
          done
          test "$(docker inspect canvas-smoke --format '{{.State.Health.Status}}')" = "healthy"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3019/healthz)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3019/login)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3019/)" = "302"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3019/api/auth/session)" = "401"
      - name: Show logs on failure
        if: failure()
        run: docker logs canvas-smoke
